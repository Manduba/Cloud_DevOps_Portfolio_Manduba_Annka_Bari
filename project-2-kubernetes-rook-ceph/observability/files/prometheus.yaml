apiVersion: v1
kind: Pod
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  containers:
    - name: prometheus
      image: prom/prometheus
      ports:
        - containerPort: 9090
      volumeMounts:
        - name: prometheus-storage
          mountPath: /prometheus
  volumes:
    - name: prometheus-storage
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090